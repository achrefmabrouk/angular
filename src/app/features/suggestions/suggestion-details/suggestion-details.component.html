<div class="container" *ngIf="suggestion">
  <div class="detail-card">
    <div class="header">
      <h2>Détails de la Suggestion #{{ suggestion.id }}</h2>
      <span [ngClass]="{
        'status-acceptee': suggestion.status === 'acceptee',
        'status-refusee': suggestion.status === 'refusee',
        'status-en-attente': suggestion.status === 'en_attente'
      }" class="badge">
        {{ suggestion.status }}
      </span>
    </div>

    <hr class="separator">

    <div class="info-grid">
      <div class="info-item">
        <label>Titre</label>
        <p class="value bold">{{ suggestion.title }}</p>
      </div>

      <div class="info-item">
        <label>Catégorie</label>
        <p class="value">{{ suggestion.category }}</p>
      </div>

      <div class="info-item">
        <label>Date de création</label>
        <p class="value">{{ suggestion.date | date:'dd/MM/yyyy' }}</p>
      </div>

      <div class="info-item">
        <label>Popularité</label>
        <p class="value">👍 {{ suggestion.nbLikes }} Likes</p>
      </div>

      <div class="info-item full-width">
        <label>Description complète</label>
        <div class="description-box">
          {{ suggestion.description }}
        </div>
      </div>
    </div>

    <div class="actions">
      <button routerLink="/suggestions" class="btn-back">
        ⬅ Retour à la liste
      </button>
<button *ngIf="suggestion" [routerLink]="['/suggestions/update', suggestion.id]">
  Update
</button>    </div>
  </div>
</div>

<div class="container" *ngIf="!suggestion">
  <div class="error-card">
    <p>⚠️ Aucune suggestion trouvée pour cet identifiant.</p>
    <button routerLink="/suggestions" class="btn-back">Retour à la liste</button>
  </div>
</div>
